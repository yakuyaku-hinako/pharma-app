<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>テスト</title>
<style>body{font-family:sans-serif;padding:16px}.ok{color:#1a7f4b}.ng{color:#c00;font-weight:bold}</style>
</head><body>
<h2>自動テスト</h2><p id="summary">実行中…</p><ul id="log"></ul>
<script src="js/stats.js"></script>
<script src="js/db.js"></script>
<script src="js/backup.js"></script>
<script src="js/learn.js"></script>
<script src="js/frog.js"></script>
<script>
const results = [];
const eq = (a, b, msg) => { if (a !== b) throw new Error(`${msg || ''} 期待:${b} 実際:${a}`); };
async function test(name, fn) {
  try { await fn(); results.push([name, true]); }
  catch (e) { results.push([name, false, e.message]); }
}
async function freshDB() { await DB.open('test-' + Math.random()); await DB.seedIfNeeded(); }
async function setup() { // カテゴリ・疑問・ノート・問題を1つずつ作る
  await freshDB();
  const cat = (await DB.getAll('categories'))[0];
  const q = await DB.addQuestion({ categoryId: cat.id, content: '疑問' });
  const note = await DB.saveNote(q.id, { researchedContent: '調査', myAnswer: '回答' });
  const quiz = await DB.addQuiz({ noteId: note.id, questionText: 'Q',
    choices: { A: 'a', B: 'b', C: 'c', D: 'd' }, correctAnswer: 'B' });
  return { cat, q, note, quiz };
}

(async () => {
  await test('★の境界値', () => {
    eq(Stats.stars(0, 0), 0); eq(Stats.stars(9, 10), 3); eq(Stats.stars(89, 100), 2);
    eq(Stats.stars(5, 10), 2); eq(Stats.stars(49, 100), 1);
  });
  await test('理解度(回答なしは0%)', () => {
    eq(Stats.accuracyPercent(0, 0), 0); eq(Stats.accuracyPercent(76, 100), 76);
  });
  await test('正誤判定(まだ不安は不正解)', () => {
    eq(Stats.judge('B', 'B'), true); eq(Stats.judge('A', 'B'), false); eq(Stats.judge('unsure', 'B'), false);
  });
  await test('新規/復習の判定', () => {
    const h = (t, ok) => ({ answeredAt: t, isCorrect: ok });
    eq(Stats.isNew([]), true);
    eq(Stats.isNew([h('2026-01-01', false), h('2026-01-02', true)]), false);
    eq(Stats.isNew([h('2026-01-02', true), h('2026-01-01', false)]), false, '順序に依存しない');
    eq(Stats.isNew([h('2026-01-01', true), h('2026-01-03', false)]), true);
  });
  await test('連続学習日数', () => {
    const today = new Date(2026, 9, 8, 12);
    const d = n => { const x = new Date(today); x.setDate(x.getDate() - n); return x; };
    eq(Stats.streak([], today), 0);
    eq(Stats.streak([d(0), d(1), d(2)], today), 3);
    eq(Stats.streak([d(1), d(2)], today), 2, '今日未回答でも維持');
    eq(Stats.streak([d(2), d(3)], today), 0, '途切れ');
  });
  await test('7日ドット', () => {
    const today = new Date(2026, 9, 8, 12);
    eq(Stats.last7([], today).filter(Boolean).length, 0);
    eq(Stats.last7([today], today)[6], true);
  });
  await test('カテゴリ初期投入は1回だけ(3種)', async () => {
    await freshDB(); await DB.seedIfNeeded();
    eq((await DB.getAll('categories')).length, 3);
  });
  await test('ノート保存で疑問が「調査済み」になる', async () => {
    const { q } = await setup();
    eq((await DB.get('questions', q.id)).status, '調査済み');
  });
  await test('ノート削除しても問題は残り「情報源なし」(noteId=null)', async () => {
    const { note, quiz } = await setup();
    await DB.deleteNote(note.id);
    eq((await DB.getAll('quizzes')).length, 1);
    eq((await DB.get('quizzes', quiz.id)).noteId, null);
  });
  await test('問題削除で回答履歴も消える', async () => {
    const { quiz } = await setup();
    await DB.answerQuiz(quiz.id, 'B');
    await DB.deleteQuiz(quiz.id);
    eq((await DB.getAll('histories')).length, 0);
  });
  await test('回答履歴の保存(正解/まだ不安)', async () => {
    const { quiz } = await setup();
    eq((await DB.answerQuiz(quiz.id, 'B')).isCorrect, true);
    eq((await DB.answerQuiz(quiz.id, 'unsure')).isCorrect, false);
  });
  await test('文字数制限・必須チェック', async () => {
    await freshDB();
    const cat = (await DB.getAll('categories'))[0];
    let failed = 0;
    try { await DB.addQuestion({ categoryId: cat.id, content: 'あ'.repeat(201) }); } catch { failed++; }
    try { await DB.addQuestion({ categoryId: null, content: 'x' }); } catch { failed++; }
    try { await DB.addQuiz({ noteId: null, questionText: 'Q', choices: {}, correctAnswer: 'A' }); } catch { failed++; }
    eq(failed, 3);
  });

  await test('問題の更新(正解の変更・不正値は拒否)', async () => {
    const { quiz } = await setup();
    const ch = { A: 'a', B: 'b', C: 'c', D: 'd' };
    const u = await DB.updateQuiz(quiz.id, { questionText: '新', choices: ch, correctAnswer: 'C' });
    eq(u.correctAnswer, 'C'); eq((await DB.get('quizzes', quiz.id)).questionText, '新');
    let failed = 0;
    try { await DB.updateQuiz(quiz.id, { questionText: '新', choices: ch, correctAnswer: 'E' }); } catch { failed++; }
    try { await DB.updateQuiz(quiz.id, { questionText: '', choices: ch, correctAnswer: 'A' }); } catch { failed++; }
    eq(failed, 2);
  });

  await test('出題: 新規を優先し、足りなければ復習で補充(5問)', () => {
    const mk = (n, isNew) => Array.from({ length: n }, (_, i) => ({ id: (isNew ? 'n' : 'r') + i, isNew }));
    let r = QuizSelector.pick([...mk(8, true), ...mk(8, false)], 5);
    eq(r.length, 5); eq(r.every(x => x.isNew), true, '新規のみ');
    r = QuizSelector.pick([...mk(3, true), ...mk(10, false)], 5);
    eq(r.filter(x => x.isNew).length, 3); eq(r.length, 5);
    eq(QuizSelector.pick(mk(2, false), 5).length, 2, '5問未満');
    eq(QuizSelector.pick([], 5).length, 0);
  });
  await test('Learn.load: 情報源なしの問題と新規/復習の判定', async () => {
    const { note, quiz } = await setup();
    let d = await Learn.load();
    eq(d.items[0].isNew, true); eq(d.items[0].note.id, note.id);
    await DB.answerQuiz(quiz.id, 'B');
    d = await Learn.load(); eq(d.items[0].isNew, false, '正解後は復習');
    await DB.answerQuiz(quiz.id, 'unsure', new Date(Date.now() + 1000));
    d = await Learn.load(); eq(d.items[0].isNew, true, '不正解後は新規');
    await DB.deleteNote(note.id);
    d = await Learn.load(); eq(d.items[0].note, null, '情報源なし');
  });

  await test('検索: 疑問・調べた内容・自分の回答・タグ/全角半角/AND', async () => {
    await freshDB();
    const cat = (await DB.getAll('categories'))[0];
    const q = await DB.addQuestion({ categoryId: cat.id, content: 'DOACとNSAIDs', tags: ['相互作用'] });
    await DB.saveNote(q.id, { researchedContent: '消化管出血', myAnswer: '患者背景を確認' });
    const e = (await Learn.loadNotes()).entries[0];
    eq(Learn.matches(e, 'nsaids'), true, '大小文字'); eq(Learn.matches(e, 'ＮＳＡＩＤｓ'), true, '全角');
    eq(Learn.matches(e, '出血'), true, '調べた内容'); eq(Learn.matches(e, '患者背景'), true, '自分の回答');
    eq(Learn.matches(e, '相互作用'), true, 'タグ'); eq(Learn.matches(e, 'NSAIDs 出血'), true, 'AND');
    eq(Learn.matches(e, 'NSAIDs 腎機能'), false); eq(Learn.matches(e, ''), true);
  });
  await test('学習記録一覧: ★と情報源なしの分離', async () => {
    const { note, quiz } = await setup();
    let r = await Learn.loadNotes();
    eq(r.entries[0].stars, 0, '未回答'); eq(r.entries[0].last, null);
    await DB.answerQuiz(quiz.id, 'B');
    r = await Learn.loadNotes();
    eq(r.entries[0].stars, 3); eq(r.entries[0].total, 1);
    await DB.deleteQuestion(r.entries[0].question.id);
    r = await Learn.loadNotes();
    eq(r.entries.length, 0); eq(r.orphans.length, 1, '問題は情報源なしで残る');
  });

  await test('バックアップ: 書き出し→全置換で復元できる', async () => {
    const { quiz } = await setup();
    await DB.answerQuiz(quiz.id, 'B');
    const data = JSON.parse(JSON.stringify(await Backup.export()));
    await freshDB();
    await Backup.import(data, 'replace');
    eq((await DB.getAll('questions')).length, 1); eq((await DB.getAll('notes')).length, 1);
    eq((await DB.getAll('quizzes')).length, 1); eq((await DB.getAll('histories')).length, 1);
  });
  await test('バックアップ: 追加は重複せず、カテゴリは名前で統合', async () => {
    await setup();
    const data = JSON.parse(JSON.stringify(await Backup.export()));
    await freshDB();                                  // 別端末(初期カテゴリのidが違う)
    await Backup.import(data, 'merge');
    await Backup.import(data, 'merge');               // 2回入れても増えない
    eq((await DB.getAll('categories')).length, 3, 'カテゴリが重複しない');
    eq((await DB.getAll('questions')).length, 1); eq((await DB.getAll('quizzes')).length, 1);
    const q = (await DB.getAll('questions'))[0];
    eq(!!(await DB.get('categories', q.categoryId)), true, '疑問のカテゴリが存在する');
  });
  await test('バックアップ: 不正なファイルは拒否し、データを変更しない', async () => {
    await setup();
    let failed = 0;
    try { await Backup.import({ app: 'other' }, 'replace'); } catch { failed++; }
    try { await Backup.import({ app: 'pharma-app', schemaVersion: 1, categories: [] }, 'replace'); } catch { failed++; }
    eq(failed, 2); eq((await DB.getAll('questions')).length, 1);
  });

  await test('カエル画像(顔9枚・全身9枚)がすべて読み込める', async () => {
    const bad = [];
    await Promise.all(Frog.NAMES.flatMap(n => ['face', 'body'].map(k => new Promise(res => {
      const i = new Image(); i.onload = () => res();
      i.onerror = () => { bad.push(k + '/' + n); res(); }; i.src = Frog.src(n, k);
    }))));
    eq(bad.length, 0, '読み込めない: ' + bad.join(', '));
  });
  await test('Frog.img: 不明な表情名は喜に置き換える', () => {
    eq(Frog.img('xxx').includes('face/joy.svg'), true);
    eq(Frog.img('worry', 'body', 50).includes('body/worry.svg'), true);
  });

  await test('最新の回答結果: 未回答/正解/不正解(履歴の並び順に依存しない)', () => {
    const h = (t, ok) => ({ answeredAt: new Date(t).toISOString(), isCorrect: ok });
    eq(Stats.lastResult([]), 'none');
    eq(Stats.lastResult([h(1000, false), h(2000, true)]), 'correct');
    eq(Stats.lastResult([h(2000, true), h(1000, false)]), 'correct', '順序に依存しない');
    eq(Stats.lastResult([h(1000, true), h(2000, false)]), 'wrong', '過去の正解が最新を上書きしない');
  });
  await test('理解度フィルター(0〜3・すべて)', () => {
    eq(Learn.starOk(0, 'all'), true); eq(Learn.starOk(0, 0), true);
    eq(Learn.starOk(0, 1), false); eq(Learn.starOk(3, 3), true); eq(Learn.starOk(2, 3), false);
  });
  await test('問題一覧フィルター: 回答状況と理解度を併用できる', () => {
    const rows = [{ status: 'wrong', stars: 1 }, { status: 'wrong', stars: 2 }, { status: 'correct', stars: 1 },
                  { status: 'none', stars: 0 }, { status: 'correct', stars: 3 }];
    eq(Learn.filterQuizzes(rows, {}).length, 5, 'すべて');
    eq(Learn.filterQuizzes(rows, { status: 'none' }).length, 1, '未回答');
    eq(Learn.filterQuizzes(rows, { status: 'correct' }).length, 2);
    eq(Learn.filterQuizzes(rows, { status: 'wrong', stars: 1 }).length, 1, '不正解かつ★1');
    eq(Learn.filterQuizzes(rows, { stars: 0 }).length, 1, '未設定(0)');
    eq(Learn.filterQuizzes(rows, { status: 'correct', stars: 2 }).length, 0);
  });
  await test('問題一覧: 最新の回答で分類し、一覧の表示でデータは変わらない', async () => {
    const { quiz } = await setup();
    let r = Learn.quizRow((await Learn.load()).items[0]);
    eq(r.status, 'none'); eq(r.stars, 0);
    await DB.answerQuiz(quiz.id, 'B', new Date(2000));      // 正解
    await DB.answerQuiz(quiz.id, 'A', new Date(1000));      // 過去の不正解(あとから保存)
    r = Learn.quizRow((await Learn.load()).items[0]);
    eq(r.status, 'correct', '最新(日時)の回答で判定'); eq(r.total, 2); eq(r.stars, 2, '1/2=50%→★2');
    Learn.filterQuizzes([r], { status: 'wrong' });
    eq((await DB.getAll('histories')).length, 2, '履歴は変更されない');
    eq((await DB.getAll('quizzes')).length, 1);
  });

  await test('連続学習: 疑問の登録・ノート作成・問題作成でもカウントされる(回答なし)', async () => {
    const { q, note, quiz } = await setup();
    const day = n => { const x = new Date(); x.setHours(12, 0, 0, 0); x.setDate(x.getDate() - n); return x.toISOString(); };
    await DB.put('questions', { ...q, createdAt: day(2) });      // 2日前: 疑問を登録
    await DB.put('notes', { ...note, createdAt: day(1) });       // 昨日: 学習記録をつけた
    await DB.put('quizzes', { ...quiz, createdAt: day(0) });     // 今日: 問題を作成
    const d = await Learn.load();
    eq(d.histories.length, 0, '回答履歴はなし');
    eq(Stats.streak(d.activity), 3);
    eq(Stats.last7(d.activity).filter(Boolean).length, 3);
  });
  await test('連続学習: 何もなければ0日', async () => {
    await freshDB();
    eq(Stats.streak((await Learn.load()).activity), 0);
  });
  await test('理解度フィルターの「未回答」(0)', () => {
    eq(STAR_FILTERS[1][1], '未回答'); eq(STAR_FILTERS[1][0], 0);
  });

  await test('すべて削除: 学習データだけ消え、カテゴリ(初期3種)は残る', async () => {
    const { quiz } = await setup();
    await DB.answerQuiz(quiz.id, 'B');
    await Backup.resetAll(false);
    for (const s of ['questions', 'notes', 'quizzes', 'histories'])
      eq((await DB.getAll(s)).length, 0, s + ' が空');
    eq((await DB.getAll('categories')).length, 3, 'カテゴリは残る');
    const d = await Learn.load();
    eq(d.items.length, 0); eq(Stats.streak(d.activity), 0, '連続日数も0');
  });
  await test('すべて削除: DBを開き直しても復活しない(再読み込み相当)', async () => {
    const name = 'test-reload-' + Math.random();
    await DB.open(name); await DB.seedIfNeeded();
    const cat = (await DB.getAll('categories'))[0];
    await DB.addQuestion({ categoryId: cat.id, content: '消える疑問' });
    await Backup.resetAll(false);
    DB.close(); await DB.open(name);
    eq((await DB.getAll('questions')).length, 0);
  });
  await test('すべて削除: 失敗したら何も消えず、エラーになる', async () => {
    await setup();
    let failed = false;
    try { await DB.clearMany(['questions', 'ない保管庫']); } catch { failed = true; }
    eq(failed, true, 'エラーが通知される');
    eq((await DB.getAll('questions')).length, 1, 'データは残っている');
  });

  const ng = results.filter(r => !r[1]).length;
  document.getElementById('summary').textContent =
    ng === 0 ? `✅ すべて合格(${results.length}件)` : `❌ ${ng}件失敗 / ${results.length}件`;
  document.getElementById('log').innerHTML = results.map(([n, ok, m]) =>
    `<li class="${ok ? 'ok' : 'ng'}">${ok ? '○' : '×'} ${n}${m ? ' … ' + m : ''}</li>`).join('');
})();
</script>
</body></html>
